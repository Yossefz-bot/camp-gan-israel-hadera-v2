<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#ff6b16">
  <meta name="description" content="גלריית יום בקעמפ גן ישראל חדרה">
  <title>גלריית הקעמפ</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/assets/css/main.css?v=15.0.0">
  <script src="/assets/js/day.js?v=15.2.0" defer></script>
</head>
<body class="day-page">
  <a class="skip-link" href="#main">דלג לתוכן</a>
  <header class="site-header compact-header">
    <div class="container header-inner">
      <a class="brand" href="/"><span class="brand-mark">GI</span><span class="brand-copy"><strong>קעמפ גן ישראל חדרה</strong><small>גלריית היום</small></span></a>
      <div class="header-actions"><a class="button button-small button-ghost" href="/#galleries">← לכל הגלריות</a><button class="icon-button" id="theme-toggle" aria-label="מצב תצוגה"><svg class="sun-icon" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.66 6.34l1.41-1.41"></path></svg></button></div>
    </div>
  </header>

  <main id="main">
    <section class="day-hero" id="day-hero">
      <div class="day-hero-bg" id="day-cover"></div><div class="day-hero-overlay"></div>
      <div class="container day-hero-content"><a class="day-back" href="/#galleries">← חזרה לגלריות</a><span class="pill" id="day-label">יום בקעמפ</span><h1 id="day-title">טוען את הגלריה...</h1><div class="day-meta"><span id="day-date"></span><span id="day-count"></span></div><p id="day-description"></p><div class="day-actions"><button class="button button-light" id="share-day">שיתוף היום</button><button class="button button-glass" id="favorites-toggle">♥ מועדפים <span id="favorites-count">0</span></button></div></div>
      <div class="hero-wave" aria-hidden="true"><svg viewBox="0 0 1440 120" preserveAspectRatio="none"><path d="M0 72C236 135 395 11 667 66c259 52 501 52 773-9v63H0z"></path></svg></div>
    </section>

    <section class="section day-video-section is-hidden" id="day-video-section"><div class="container"><div class="section-heading centered"><span class="eyebrow">צפו במה שהיה</span><h2>סרטון <em>היום</em></h2></div><div class="day-video-wrap" id="day-video-wrap"></div></div></section>

    <section class="section day-story-section is-hidden" id="day-story-section"><div class="container"><article class="day-story-card"><span class="story-quote">״</span><div><span class="eyebrow">הסיפור של היום</span><h2>רגעים ששווה לזכור</h2><p id="day-story"></p></div></article></div></section>

    <section class="section day-gallery-section">
      <div class="container">
        <div class="section-heading split-heading"><div><span class="eyebrow">פותחים אלבום</span><h2>התמונות של <em>היום</em></h2></div><div class="day-gallery-tools"><button class="chip active" data-kind="all">הכול</button><button class="chip" data-kind="image">תמונות</button><button class="chip" data-kind="video">סרטונים</button></div></div>
        <div class="masonry-grid" id="media-grid" aria-live="polite"><div class="masonry-skeleton"></div><div class="masonry-skeleton tall"></div><div class="masonry-skeleton"></div><div class="masonry-skeleton wide"></div></div>
        <div class="empty-state is-hidden" id="media-empty"><span>📷</span><h3>עוד אין כאן מדיה</h3><p>התמונות והסרטונים יופיעו כאן מיד לאחר הפרסום.</p></div>
        <div class="load-more-wrap"><button class="button button-ghost is-hidden" id="load-more">טען עוד תמונות</button></div>
      </div>
    </section>
  </main>

  <footer class="site-footer simple-footer"><div class="container footer-bottom"><span>© <span id="current-year"></span> קעמפ גן ישראל חדרה</span><a href="/">חזרה לדף הבית</a></div></footer>

  <dialog class="lightbox" id="lightbox"><div class="lightbox-shell"><button class="lightbox-close" id="lightbox-close" aria-label="סגירה">×</button><button class="lightbox-nav prev" id="lightbox-prev" aria-label="הקודם">‹</button><div class="lightbox-stage" id="lightbox-stage"></div><button class="lightbox-nav next" id="lightbox-next" aria-label="הבא">›</button><div class="lightbox-footer"><div><strong id="lightbox-title"></strong><small id="lightbox-caption"></small></div><div><button class="icon-button light" id="lightbox-favorite" aria-label="הוספה למועדפים">♥</button></div></div></div></dialog>

  <div class="toast-region" id="toast-region" aria-live="polite"></div>
</body>
</html>
